[project]

name = "ai-news-agent"
version = "0.1.0"
description = "Agent that ingests, deduplicates and summarises AI news, and serves it over a REST API."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "sqlalchemy==2.0.35",
    "asyncpg==0.29.0",
    "alembic==1.13.2",
    "pgvector==0.3.4",
    "feedparser==6.0.11",
    "httpx==0.27.2",
    "selectolax==0.3.21",
    "tenacity==9.0.0",
    "anthropic==0.34.2",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
]