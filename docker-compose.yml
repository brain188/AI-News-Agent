services:
  api:
    build: .
    container_name: ai_news_api
    restart: unless-stopped
    env_file:
      # Optional: a fresh clone has no .env (it is gitignored), and every value
      # the API needs to boot is defaulted in app/config.py.
      - path: .env
        required: false
    ports:
      - "8000:8000"
    # Bind-mounted so --reload actually picks up local edits.
    volumes:
      - ./app:/app/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ai_news_worker
    restart: unless-stopped
    env_file: .env
    environment:
      PIPELINE_INTERVAL_SECONDS: 3600